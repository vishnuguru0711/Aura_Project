name: smart_stick_app
description: Smart Walking Stick - Assistive technology for visually impaired.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  geolocator: ^13.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  permission_handler: ^11.3.0
  vibration: ^2.0.0
  google_mlkit_object_detection: ^0.13.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
